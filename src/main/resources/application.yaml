server:
  # Render/Cloud Run inyectan PORT; en local se mantiene 8080.
  port: ${PORT:8080}

spring:
  application:
    name: BankApplication

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:49703/db_bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    # Orígenes permitidos para el frontend (separados por coma). "*" permite cualquiera.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:NDA0RTYzNTI2NjU1NkE1ODZFMzI3MjM1NzUzODc4MkY0MTNGNDQyODQ3MkI0QjYyNTA2NDUzNjc1NjZCNTk3MA==}
    expiration-ms: 86400000

  market-data:
    # Espejo de datos de mercado: api.binance.com responde 451 desde IPs de
    # EE. UU. (Render esta en Oregon). Se puede sobreescribir con BINANCE_BASE_URL.
    binance:
      base-url: ${BINANCE_BASE_URL:https://data-api.binance.vision}
      default-symbols:
        - BTCUSDT
        - ETHUSDT
        - BNBUSDT
        - SOLUSDT
        - XRPUSDT
        - ADAUSDT
        - DOGEUSDT
        - LINKUSDT
        - AVAXUSDT
        - DOTUSDT
    # Plan gratuito de Finnhub: https://finnhub.io/register
    # Defina la variable de entorno FINNHUB_API_KEY antes de iniciar la aplicación.
    finnhub:
      base-url: https://finnhub.io/api/v1
      api-key: ${FINNHUB_API_KEY:}